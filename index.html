<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bestie Wrapped 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d2757;--bg:#ffc2dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);transition:background .6s;overflow:hidden}
h1,h2,.d{font-family:'Bagel Fat One',Georgia,sans-serif;font-weight:400;line-height:1.05;margin:0}
.hand{font-family:Caveat,cursive;font-size:1.5rem}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;display:flex;flex-direction:column}
#bars{display:flex;gap:4px;padding:12px 14px 0}#bars i{flex:1;height:4px;border-radius:4px;background:#3d275733;overflow:hidden}#bars i.on{background:var(--ink)}
#snd{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:14px;z-index:5;background:#fff9;color:var(--ink);box-shadow:none;padding:8px 14px;font-size:.9rem}
#stage{flex:1;overflow:auto;padding:46px 22px 12px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative}
.slide{animation:in .5s both}@keyframes in{from{opacity:0;transform:translateX(30px)}}
#nav{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 18px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:13px 26px;color:#fff;background:var(--ink);transition:transform .15s}
button:hover{transform:scale(1.05)}button:disabled{opacity:.35;cursor:default;transform:none}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.round{width:48px;height:48px;padding:0;font-size:1.3rem}
.pop{opacity:0;animation:pop .6s forwards}@keyframes pop{from{transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
.big{font-size:clamp(3rem,16vw,5.5rem)}.sm{font-size:1.05rem;opacity:.85}
.gift{font-size:7rem;display:inline-block;animation:wob 1.6s ease-in-out infinite}@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.stat{margin:14px 0}.stat .d{font-size:clamp(3rem,15vw,4.8rem)}
.bar{background:#fff8;border-radius:99px;height:26px;overflow:hidden;margin:6px 0 18px}.bar b{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;font-weight:700;text-align:left}
.paper{background:#fffdf5;border-radius:18px;padding:22px;text-align:left;box-shadow:0 10px 30px #3d275722;font-size:1.05rem;line-height:1.6;min-height:260px;transform:rotate(-1deg)}
.car{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 8px;margin:0 -22px}
.pol{flex:0 0 74%;scroll-snap-align:center;background:#fff;padding:12px 12px 16px;border-radius:6px;box-shadow:0 10px 24px #3d275733;transform:rotate(var(--r))}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:3px}.pol label{cursor:pointer;display:block}
.sky{position:relative;height:250px;background:#3d2757;border-radius:24px;overflow:hidden;margin:16px 0}
.star{position:absolute;font-size:2rem;background:none;padding:6px;color:#fff6a8;box-shadow:none;animation:tw 2s infinite alternate}
.star.lit{color:#ff8fbd;animation:none;transform:scale(1.5)}@keyframes tw{to{opacity:.4;transform:scale(.8)}}
.reasons{min-height:90px}.reasons p{margin:6px 0;animation:in .4s both;font-weight:700}
.opt{display:block;width:100%;margin:8px 0;background:#fffb;color:var(--ink);text-align:left}.opt.ok{background:#fff;outline:3px solid var(--ink)}
.tcard{width:min(300px,82vw);margin:8px auto;perspective:700px}
.tc{border-radius:22px;padding:14px;color:#2d1b45;background:linear-gradient(115deg,#ffd0e3,#e3d6ff 35%,#cfeaff 55%,#fff1c9 80%);background-size:250% 250%;background-position:var(--mx,50%) var(--my,50%);border:6px solid #ffe08a;box-shadow:0 18px 40px #3d275744;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .1s;text-align:left;position:relative;overflow:hidden}
.tc::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff9 50%,transparent 65%);background-size:250% 100%;background-position:var(--mx,50%) 0;mix-blend-mode:overlay;pointer-events:none}
.tc .face{background:#fff8;border-radius:14px;text-align:center;font-size:4.2rem;padding:16px 0;margin:8px 0}
.tc .atk{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;margin-top:6px}
.tc small{display:block;margin-top:8px;font-size:.78rem}
.cake{position:relative;width:200px;margin:8px auto}
.candles{display:flex;justify-content:center;gap:20px;height:64px;align-items:flex-end}
.candle{width:11px;height:34px;background:repeating-linear-gradient(45deg,#fff,#fff 6px,#ff9ec4 6px,#ff9ec4 12px);border-radius:4px;position:relative}
.flame{position:absolute;top:-22px;left:-3px;width:16px;height:22px;background:radial-gradient(#fff6a8,#ffb347);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:fl .4s infinite alternate;transition:all .4s}@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.out .flame{opacity:0;transform:scale(0);animation:none}
.ly{height:44px;border-radius:12px;margin-top:-4px}.a{background:#fff;width:140px;margin-inline:auto}.b{background:#e3d6ff;width:175px;margin-inline:auto}.c{background:#ff9ec4;width:200px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.wish{background:#fffdf5;border-radius:18px;padding:18px;margin-top:14px;animation:pop .7s forwards;opacity:0}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}.pop,.wish{opacity:1}}
</style></head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="app">
  <div id="bars" aria-hidden="true"></div>
  <button id="snd" aria-pressed="false">🔇 Music off</button>
  <div id="stage" aria-live="polite"></div>
  <div id="nav"><button class="round" id="prev" aria-label="Previous">‹</button><span id="hint" class="sm">swipe or tap ›</span><button class="round" id="next" aria-label="Next">›</button></div>
</div>
<script>
/* ============ EDIT ME ============ */
const C={
 her:"[HER NAME]", me:"[YOUR NAME]", date:"[BIRTHDAY DATE]",
 memory:"[ADD A MEMORY]", joke:"[ADD A FUNNY JOKE]", personal:"[ADD YOUR OWN MESSAGE]",
 stats:[{n:9999,label:"hours of random talking",plus:"+"},{n:1000,label:"laughs we can't explain",plus:"+"},{n:0,label:"boring days (we don't allow them)"}],
 vibes:[["Crazy personality",100],["Kindness",98],["Snack stealing",95],["Being on time",12]],
 letter:[
  "Hey {her}, happy birthday! 🎂",
  "You are one of the best things that ever happened to me. Our laughter, silly conversations and unforgettable memories (like {memory}) make everything brighter.",
  "Nobody gets my jokes like you do. Remember {joke}? Still funny. I'm so grateful to have you in my life.",
  "{personal}",
  "No matter how much life changes, you'll always have a special place in my life as my bestie. Stay crazy, stay happy, and never stop smiling! 🫶"],
 photos:[{img:"",cap:"The craziest memories 😂"},{img:"",cap:"Our random moments 🤣"},{img:"",cap:"Memories I'll always cherish 💖"}],
 reasons:["Your crazy personality 😂","The way you make boring days fun ✨","Your kindness and caring nature 🫶","Our endless conversations 💬","Being yourself, always 💗"],
 quiz:[
  {q:"What do we do best together?",a:["Talk 4 hours about nothing","Plan things, never do them","Eat all the snacks","All of the above"],ok:3,good:"Professional-level chaos 😂",bad:"It's all of the above, obviously 🙄"},
  {q:"My reply to \"I have a small question\"?",a:["Sure, go ahead","Is it actually small?","Instant panic","Pretends to sleep"],ok:1,good:"You know me too well 🤣",bad:"It's never small 😂"},
  {q:"Who is more likely to be late?",a:["You","Me","Both, confidently","The auto, always"],ok:2,good:"Both. Confidently. ⏰",bad:"Bold, but it's both 🤭"},
  {q:"Our friendship in one word?",a:["Chaos","Therapy","Comedy show","Forever 💗"],ok:3,good:"Aww, correct 🥹",bad:"Close, it's forever 💗"}],
 scoreMsg:"Congratulations! You're officially my favourite headache! 😂💖",
 card:{emoji:"👑",title:"THE BESTIE",rarity:"Legendary · 1 of 1",atk:[["Makes boring days fun","∞"],["Instant giggles","999"]],weak:"Weakness: cold coffee & replying on time",flavor:"\"Stay crazy, stay happy.\""},
 wish:"{her}, you deserve every good thing this year. Thank you for being my person to laugh, rant and be silly with. Love, {me} 💗",
 finalMsg:"Wishing you happiness, success, good health, and lots and lots of beautiful memories.",
 made:"Made with friendship, lots of memories, and a little bit of craziness — just for you! 💗"
};
/* ================================= */
const $=s=>document.querySelector(s),f=t=>t.replace(/{her}/g,C.her).replace(/{me}/g,C.me).replace(/{memory}/g,C.memory).replace(/{joke}/g,C.joke).replace(/{personal}/g,C.personal);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* confetti */
const cv=$('#confetti'),cx=cv.getContext('2d');let P=[],raf;
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener('resize',fit);
function confetti(n=150){if(reduce)return;const k=['#ff8fbd','#c9b6ff','#ffd166','#fff','#a88bf5'];
for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.65,vx:(Math.random()-.5)*16,vy:-Math.random()*17-4,s:5+Math.random()*7,c:k[i%5],r:0,vr:(Math.random()-.5)*.4,l:140+Math.random()*60});
cancelAnimationFrame(raf);(function lp(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);
P.forEach(p=>{p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
if(P.length)raf=requestAnimationFrame(lp)})()}
/* music: original synthesized jingle, off by default */
let ac,on=false,tm;const N=[523,587,659,784,659,587,523,659,784,880,784,659,587,659,523,392];
$('#snd').onclick=ev=>{on=!on;const b=ev.currentTarget;b.textContent=on?'🎵 Music on':'🔇 Music off';b.setAttribute('aria-pressed',on);
if(!on){clearInterval(tm);return}ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let i=0;
const t=()=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=N[i++%16];
g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.42);
o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.45)};t();tm=setInterval(t,400)};
const ph=i=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${['#ffd0e3','#e3d6ff','#ffe6c9'][i%3]}"/><text x="150" y="165" font-size="70" text-anchor="middle">📷</text><text x="150" y="230" font-size="18" text-anchor="middle" fill="#3d2757" font-family="sans-serif">Tap to add your photo</text></svg>`);
/* slides: [background, builder(el)] */
const L=(t,d)=>`<div class="pop" style="animation-delay:${d}s">${t}</div>`;
const S=[
["#ffc2dd",el=>{el.innerHTML=L('<div class="gift">🎁</div>',0)+L('<h1 class="big">Hey Bestie! 🎁</h1>',.2)+L('<p class="sm">Someone made something special just for you...</p>',.4)+L('<p class="hand">'+e(C.her)+' Wrapped · '+e(C.date)+'</p>',.6)+L('<button id="go">Open Your Surprise ✨</button>',.8);$('#go').onclick=()=>{confetti(120);go(1)}}],
["#d9c8ff",el=>{el.innerHTML=L('<p class="hand">your year as my bestie</p>',0)+C.stats.map((s,i)=>`<div class="stat pop" style="animation-delay:${.2+i*.35}s"><div class="d" data-n="${s.n}" data-p="${s.plus||''}">0</div><div class="sm">${e(s.label)}</div></div>`).join('');
el.querySelectorAll('[data-n]').forEach((d,i)=>{const n=+d.dataset.n,t0=performance.now()+300+i*350;(function u(t){const k=Math.min(1,Math.max(0,(t-t0)/1300));d.textContent=Math.round(n*(1-Math.pow(1-k,3))).toLocaleString()+(k==1?d.dataset.p:'');if(k<1)requestAnimationFrame(u)})(t0)})}],
["#fff1d6",el=>{el.innerHTML=L('<h2>Your top vibes 🌷</h2>',0)+'<div style="margin-top:22px">'+C.vibes.map(([n,v],i)=>`<div class="pop" style="animation-delay:${.2+i*.2}s"><div class="row"><span>${e(n)}</span><span>${v}%</span></div><div class="bar"><b data-w="${v}"></b></div></div>`).join('')+'</div>';
setTimeout(()=>el.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'),500)}],
["#ffd6e8",el=>{el.innerHTML='<h2 style="margin-bottom:14px">A message for you 💌</h2><div class="paper"><span id="tx"></span></div><p class="sm" style="margin-top:10px">tap the letter to skip typing</p>';
const full=C.letter.map(f).join('\n\n'),tx=$('#tx');let i=0,id=setInterval(()=>{tx.textContent=full.slice(0,++i);tx.style.whiteSpace='pre-wrap';if(i>=full.length)clearInterval(id)},reduce?1:28);
el.querySelector('.paper').onclick=()=>{clearInterval(id);tx.textContent=full};el._off=()=>clearInterval(id)}],
["#e6dcff",el=>{el.innerHTML='<h2>Our memories 📸</h2><p class="sm">swipe the polaroids · tap one to add your photo</p><div class="car">'+C.photos.map((p,i)=>`<figure class="pol" style="--r:${[-3,2,-2][i%3]}deg;margin:0"><label><img src="${p.img?e(p.img):ph(i)}" alt="Memory ${i+1}: ${e(p.cap)}"><input type="file" accept="image/*" hidden></label><p class="hand" style="margin:8px 0 0">${e(p.cap)}</p></figure>`).join('')+'</div>';
el.querySelectorAll('input').forEach(n=>n.onchange=x=>{const fl=x.target.files[0];if(fl)n.previousElementSibling.src=URL.createObjectURL(fl)})}],
["#fff1d6",el=>{const pos=[[10,15],[65,10],[38,40],[12,68],[72,62]];let lit=0;
el.innerHTML='<h2>Catch the stars ⭐</h2><p class="sm">Tap each star to find a reason you\'re an amazing bestie.</p><div class="sky">'+C.reasons.map((r,i)=>`<button class="star" style="left:${pos[i%5][0]}%;top:${pos[i%5][1]}%;animation-delay:${i*.3}s" aria-label="Star ${i+1}">⭐</button>`).join('')+'</div><div class="reasons" id="rs"></div>';
el.querySelectorAll('.star').forEach((s,i)=>s.onclick=()=>{if(s.classList.contains('lit'))return;s.classList.add('lit');s.textContent='💗';lit++;
$('#rs').insertAdjacentHTML('beforeend','<p>'+e(C.reasons[i])+'</p>');if(lit==C.reasons.length){confetti(80);$('#rs').insertAdjacentHTML('beforeend','<p class="hand">all five found! ✨</p>')}})}],
["#d9c8ff",el=>{let qi=0,sc=0;const q=()=>{const x=C.quiz[qi];el.innerHTML=`<h2 style="font-size:1.9rem">Funny Bestie Quiz 😂</h2><p class="sm">Question ${qi+1} of ${C.quiz.length}</p><h3 style="margin:10px 0">${e(x.q)}</h3>`+x.a.map((a,i)=>`<button class="opt" data-i="${i}">${e(a)}</button>`).join('')+'<p id="fb" style="font-weight:700;min-height:2.2em"></p><button id="nq" class="hidden">'+(qi==C.quiz.length-1?'See my score 🎉':'Next question')+'</button>';
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i==x.ok){sc++;confetti(25)}el.querySelectorAll('.opt').forEach(o=>o.disabled=true);el.querySelector(`[data-i="${x.ok}"]`).classList.add('ok');$('#fb').textContent=i==x.ok?x.good:x.bad;$('#nq').classList.remove('hidden')});
$('#nq').onclick=()=>{qi++;qi<C.quiz.length?q():end()}};
const end=()=>{confetti();el.innerHTML=`<div style="font-size:5rem" class="pop">🏆</div><h2>${sc} / ${C.quiz.length}</h2><p style="font-weight:700;margin:14px 0">${e(C.scoreMsg)}</p><button id="ag">Play again</button>`;$('#ag').onclick=()=>{qi=0;sc=0;q()}};q()}],
["#ffc2dd",el=>{const c=C.card;el.innerHTML='<p class="hand">you unlocked a rare card…</p><div class="tcard"><div class="tc" id="tc"><div class="d" style="font-size:1.5rem">'+e(C.her)+' — '+e(c.title)+'</div><div class="face">'+c.emoji+'</div><small><b>'+e(c.rarity)+'</b></small>'+c.atk.map(a=>`<div class="atk"><span>${e(a[0])}</span><span>${e(a[1])}</span></div>`).join('')+'<small>'+e(c.weak)+'</small><small><i>'+e(c.flavor)+'</i></small></div></div><p class="sm">tilt your phone or move your finger over the card</p>';
const t=$('#tc'),mv=ev=>{const r=t.getBoundingClientRect(),x=((ev.clientX-r.left)/r.width),y=((ev.clientY-r.top)/r.height);t.style.setProperty('--ry',(x-.5)*24+'deg');t.style.setProperty('--rx',(.5-y)*24+'deg');t.style.setProperty('--mx',x*100+'%');t.style.setProperty('--my',y*100+'%')};
t.addEventListener('pointermove',mv);t.addEventListener('pointerleave',()=>{t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg')})}],
["#fff1d6",el=>{el.innerHTML=L('<h1 style="font-size:clamp(2rem,10vw,3.4rem)">HAPPY BIRTHDAY, BESTIEEE! 💗</h1>',0)+'<div class="cake" id="ck"><div class="candles">'+'<div class="candle"><div class="flame"></div></div>'.repeat(5)+'</div><div class="ly a"></div><div class="ly b"></div><div class="ly c"></div></div><button id="bl">Blow out the candles 🕯️</button><div id="fin" class="hidden"></div>';
$('#bl').onclick=()=>{$('#ck').classList.add('out');confetti(100);$('#bl').outerHTML='<button id="sp">One Last Surprise... 🎁</button>';$('#sp').onclick=()=>{$('#sp').classList.add('hidden');confetti(260);setTimeout(()=>confetti(200),500);
const d=$('#fin');d.classList.remove('hidden');d.innerHTML='<div style="font-size:4.5rem" class="pop">🎉</div><div class="wish">'+e(f(C.wish))+'</div><h2 style="font-size:1.8rem;margin-top:16px">Happy Birthday Once Again, Bestie! 🥳</h2><p>'+e(C.finalMsg)+'</p><p class="hand">'+e(C.made)+'</p>';d.scrollIntoView({behavior:'smooth',block:'center'})}}}]
];
/* engine */
let cur=0;const st=$('#stage');
$('#bars').innerHTML=S.map(()=>'<i></i>').join('');
function go(i){if(i<0||i>=S.length)return;if(st._off)st._off();cur=i;document.documentElement.style.setProperty('--bg',S[i][0]);
document.querySelectorAll('#bars i').forEach((b,k)=>b.classList.toggle('on',k<=i));
st.innerHTML='';const d=document.createElement('div');d.className='slide';st.appendChild(d);st.scrollTop=0;S[i][1](d);st._off=d._off;
$('#prev').disabled=i==0;$('#next').disabled=i==S.length-1;$('#hint').textContent=i==0?'tap the button ✨':(i==S.length-1?'the end 💗':'swipe or tap ›')}
$('#next').onclick=()=>go(cur+1);$('#prev').onclick=()=>go(cur-1);
addEventListener('keydown',k=>{if(k.key=='ArrowRight')go(cur+1);if(k.key=='ArrowLeft')go(cur-1)});
let sx=null;st.addEventListener('touchstart',t=>sx=t.touches[0].clientX,{passive:true});
st.addEventListener('touchend',t=>{if(sx===null)return;const dx=t.changedTouches[0].clientX-sx;sx=null;if(t.target.closest('.car,.tc'))return;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1))});
go(0);
</script></body></html>
